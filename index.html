<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Franchise Outreach Assistant</title>
    <style>
        :root {
            --bg-color: #0b0f19; /* Pure deep dark background */
            --card-bg: #111827; /* Dark gray container card */
            --primary: #0077b5; /* LinkedIn Blue */
            --primary-hover: #005582;
            --text: #f3f4f6; /* Bright white/gray text for high contrast */
            --sub-text: #9ca3af;
            --border: #374151; /* Dark gray subtle borders */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
            font-size: 24px;
            text-align: center;
        }

        .config-bar {
            background: #1f2937;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid var(--border);
        }

        .config-bar label {
            font-weight: bold;
            font-size: 14px;
            color: var(--text);
        }

        select, input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background-color: #111827;
            color: var(--text);
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            resize: vertical;
            box-sizing: border-box;
            background-color: #1f2937;
            color: var(--text);
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #374151;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .result-box {
            border-top: 2px solid var(--border);
            padding-top: 20px;
            margin-top: 20px;
            min-height: 120px;
            white-space: pre-wrap; 
            line-height: 1.6;
            color: #e5e7eb;
        }

        .loading {
            color: #9ca3af;
            font-style: italic;
            text-align: center;
        }
        
        .error {
            color: #f87171;
            background: #7f1d1d33;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #7f1d1d;
        }
    </style>
</head>
<body>

</div>
