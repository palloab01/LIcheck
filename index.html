<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Franchise Outreach Assistant</title>
    <style>
        :root {
            --bg-color: #0b0f19; 
            --card-bg: #111827; 
            --primary: #0077b5; 
            --primary-hover: #005582;
            --text: #f3f4f6; 
            --sub-text: #9ca3af;
            --border: #374151; 
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        h1 {
            margin-top: 0;
            color: var(--primary);
            font-size: 24px;
            text-align: center;
        }

        .status-banner {
            background: #1e293b;
            border: 1px solid var(--primary);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #38bdf8;
            text-align: center;
        }

        .config-bar {
            background: #1f2937;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid var(--border);
        }

        .config-bar label {
            font-weight: bold;
            font-size: 14px;
            color: var(--text);
        }

        select, input[type="password"] {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background-color: #111827;
            color: var(--text);
        }

        input[type="password"] {
            flex: 1;
            min-width: 200px;
        }

        .search-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            resize: vertical;
            box-sizing: border-box;
            background-color: #1f2937;
            color: var(--text);
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #374151;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .result-box {
            border-top: 2px solid var(--border);
            padding-top: 20px;
            margin-top: 20px;
            min-height: 120px;
            white-space: pre-wrap; 
            line-height: 1.6;
            color: #e5e7eb;
        }

        .loading {
            color: #fbbf24 !important;
            font-style: italic;
            text-align: center;
            font-weight: bold;
        }
        
        .error {
            color: #f87171 !important;
            background: #7f1d1d33;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #f87171;
            font-family: monospace;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Franchise Ownership Outreach Assistant</h1>

    <div class="status-banner" id="statusBanner">
        🔒 ENGINE DEPLOYING: KEY VALIDATION INITIALIZED
    </div>

    <div class="config-bar">
        <div style="display: flex; align-items: center; gap: 10px; width: 100%;">
            <label for="apiKeyField">OpenAI API Key:</label>
            <input type="password" id="apiKeyField" placeholder="Paste your sk-proj-... key here">
        </div>
    </div>

    <div class="config-bar">
        <div>
            <label for="sessionMode">Active Session Mode: </label>
            <select id="sessionMode">
                <option value="INVITE">INVITE</option>
                <option value="INMAIL">INMAIL</option>
                <option value="DM">DM (Post-Acceptance)</option>
                <option value="NURTURE">NURTURE (Reply Handling)</option>
                <option value="FU">FOLLOW-UP (FU)</option>
            </select>
        </div>

        <div>
            <label for="clientName">On Behalf of: </label>
            <select id="clientName">
                <option value="Doug Stout">Doug Stout</option>
                <option value="Todd Weiss">Todd Weiss</option>
                <option value="Irving Chung">Irving Chung</option>
                <option value="Brendan Meyer">Brendan Meyer</option>
                <option value="Marc Desormeaux">Marc Desormeaux</option>
                <option value="Mike Ciccarelli">Mike Ciccarelli</option>
                <option value="Robert (Bob) Bernotas">Robert (Bob) Bernotas</option>
                <option value="Bruce Brady">Bruce Brady</option>
            </select>
        </div>
    </div>

    <div class="search-box">
        <label for="profileData"><strong>Paste LinkedIn/Sales Navigator Profile Text or Active Thread here:</strong></label>
        <textarea id="profileData" placeholder="Paste target profile details here..."></textarea>
        <button id="analyzeBtn">Process Prospect Data</button>
    </div>

    <div id="output" class="result-box">Your personalized outreach or response handling layout will appear here...</div>
</div>

<script>
    // Independent event configuration model decoupled from root domain settings
    document.addEventListener("DOMContentLoaded", () => {
        const btn = document.getElementById('analyzeBtn');
        const statusBanner = document.getElementById('statusBanner');
        const keyField = document.getElementById('apiKeyField');
        
        statusBanner.innerText = "⚡ SYSTEM ENGINE ONLINE: Paste your key and click below";
        statusBanner.style.color = "#38bdf8";

        // Pull stored credentials independently of old paths
        const savedKey = localStorage.getItem('user_openai_key_secure');
        if (savedKey) {
            keyField.value = savedKey;
            statusBanner.innerText = "✅ SECURE TOKEN MOUNTED: Ready to process data profiles";
            statusBanner.style.color = "#34a853";
        }

        // Lock values dynamically on change inputs
        keyField.addEventListener("input", () => {
            localStorage.setItem('user_openai_key_secure', keyField.value.trim());
        });

        if (btn) {
            btn.addEventListener("click", async (e) => {
                e.preventDefault();
                await executePipeline();
            });
        }
    });

    async function executePipeline() {
        const userApiKey = document.getElementById('apiKeyField').value.trim();
        const mode = document.getElementById('sessionMode').value;
        const client = document.getElementById('clientName').value;
        const profileText = document.getElementById('profileData').value.trim();
        const outputDiv = document.getElementById('output');
        const btn = document.getElementById('analyzeBtn');
        const statusBanner = document.getElementById('statusBanner');

        if (!userApiKey) {
            alert('Please paste your OpenAI API Key into the input field at the top first.');
            return;
        }

        if (!profileText) {
            alert('Please paste some text data into the main field first.');
            return;
        }

        btn.disabled = true;
        statusBanner.innerText = "⏳ PROCESSING STEP 1/2: Submitting data pack to OpenAI Cloud routing...";
        statusBanner.style.color = "#fbbf24";
        
        outputDiv.className = "result-box loading";
        outputDiv.innerText = "Connecting directly to standard chat completions pipeline endpoint...";

        const masterPromptInstructions = `You are a LinkedIn franchise ownership outreach assistant. Your role is to analyze prospect files or ongoing threads and apply the exact operational workflows provided.

ACTIVE SESSION CONFIGURATION PARAMETERS:
- Current Target Mode: ${mode}
- Outbounding/Messaging on behalf of Client: ${client}

=================================
1. TARGET & QUALIFICATION RULES
=================================
Target Audience: Experienced U.S. professionals suited for franchise ownership.
Strong Signals: Business Owner/Founder, CEO/President/Partner, COO/CRO/Exec, VP/Director with leadership background, P&L responsibility, entrepreneurial background, career transition, strong sales/ops/finance backgrounds.
CRITICAL Geography Exclusion: Exclude completely if profile indicates location in California (CA) or New York (NY).
CRITICAL Industry/Role Exclusion: EXCLUDE any prospect who is a franchise broker, franchise consultant, franchise advisor, franchise broker network member, or business broker. Do NOT pitch individuals whose business model involves helping others buy franchises or businesses or provides advisory services.
Other Move On triggers: Insufficient seniority, explicitly states no franchise/sales inquiries, sitting elected official, or completely irrelevant profile.
